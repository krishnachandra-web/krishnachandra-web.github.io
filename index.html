<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জয় শ্রী রাধে কৃষ্ণ</title>
    <style>
        body {
            margin: 0; padding: 20px;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            text-align: center; font-family: Arial;
            min-height: 100vh;
        }
        h1 { 
            color: #8e44ad; 
            font-size: 45px; 
            text-shadow: 2px 2px 4px white;
        }
        img { 
            width: 350px; 
            max-width: 90%; 
            border-radius: 20px; 
            border: 5px solid white; 
            margin: 20px 0; 
        }
        .mantra { 
            color: #8e44ad; 
            font-size: 22px; 
            font-weight: bold; 
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h1>🙏 জয় শ্রী রাধে কৃষ্ণ 🙏</h1>
    
    <img src="radhakrishna.jpg" alt="Radha Krishna">
    
    <div class="mantra">হরে কৃষ্ণ হরে কৃষ্ণ, কৃষ্ণ কৃষ্ণ হরে হরে</div>
    <div class="mantra">হরে রাম হরে রাম, রাম রাম হরে হরে</div>
</body>
</html>
